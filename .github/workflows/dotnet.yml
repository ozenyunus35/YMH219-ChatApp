name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Derle
        run: dotnet build YMH219-ChatApp.sln -c Release
      - name: Test (localhost üzerinde gerçek TCP)
        run: dotnet test YMH219-ChatApp.sln -c Release --no-build
